# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/local-development

project_id = "driving-school-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true

# Site URL — admin app
site_url = "http://localhost:5173"

additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5174",
  "https://localhost:5173",
  "https://localhost:5174"
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false       # Signup via invite only for admin users
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false

[auth.hook.custom_access_token]
enabled = true
# For local dev: Supabase routes this to the running Edge Function runtime.
# For production: replace with https://<project-ref>.supabase.co/functions/v1/auth-hook
uri = "http://127.0.0.1:54321/functions/v1/auth-hook"
# Must match AUTH_HOOK_SECRET in supabase secrets (local: supabase/functions/.env)
secrets = "env(AUTH_HOOK_SECRET)"

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
port = 54329
backend = "postgres"

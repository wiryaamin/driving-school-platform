# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/local-development

project_id = "driving-school-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true

# Site URL — admin app
site_url = "http://localhost:5173"

additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5174",
  "https://localhost:5173",
  "https://localhost:5174"
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false       # Signup via invite only for admin users
enable_anonymous_sign_ins = false

[auth.email]
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false

[auth.hook.custom_access_token]
# REQUIRED: set AUTH_HOOK_SECRET before enabling.
# Run: openssl rand -base64 32
# Then create supabase/functions/.env (gitignored) with: AUTH_HOOK_SECRET=<output>
enabled = true
# Local dev: GoTrue runs inside Docker and cannot reach 127.0.0.1 (container loopback).
# host.docker.internal resolves to the Docker host machine on Windows/macOS Docker Desktop,
# allowing GoTrue to reach Kong (54321 on host → Kong:8000 → Edge Runtime) without HTTPS.
# Supabase's GoTrue fork whitelists host.docker.internal for HTTP auth hooks.
# Production: configure via Dashboard → Authentication → Hooks (not this file).
uri = "http://host.docker.internal:54321/functions/v1/auth-hook"
# Must match AUTH_HOOK_SECRET in supabase secrets (local: supabase/functions/.env)
secrets = "env(AUTH_HOOK_SECRET)"

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
port = 54329
backend = "postgres"

# ─── Edge Function configuration ─────────────────────────────────────────────

[functions.auth-hook]
enabled = true
verify_jwt = false

[functions.switch-tenant]
enabled = true
verify_jwt = true

# verify_jwt = false because /bankid-auth/init (login) and /collect are reached
# before any session exists — same reasoning as identity-events. Per P-023's
# hosted-deployment lesson, this setting is not reliably honored on deploy;
# the function is deployed with --no-verify-jwt directly (see Phase 3
# Completion Report). /init(link) and /collect(link) independently validate
# the caller's own JWT internally, exactly like identity-events/logout.
[functions.bankid-auth]
enabled = true
verify_jwt = false


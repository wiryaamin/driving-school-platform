# verify_jwt = false because it uses WORKER_SECRET for auth (set in secrets).
# Production cron: configure via pg_cron (see below) or Supabase scheduled functions.
#
# pg_cron setup (run once after enabling the pg_cron extension):
#   SELECT cron.schedule(
#     'event-worker-drain',
#     '* * * * *',   -- every minute; for 30-second intervals run two staggered jobs
#     $$SELECT net.http_post(
#       url     := current_setting('app.supabase_url') || '/functions/v1/event-worker',
#       headers := jsonb_build_object(
#         'Content-Type',  'application/json',
#         'Authorization', 'Bearer ' || current_setting('app.worker_secret')
#       ),
#       body    := '{}'::jsonb
#     )$$
#   );

<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trafikcloud — administratörspanel för körskolor" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Default Open Graph tags — the authenticated app's own identity.
         Public pages (apps/web/src/modules/public-site/lib/usePageMeta.ts)
         override title/description/og:*/robots per route on mount and
         restore these on unmount, so the app's own defaults are the safe
         fallback if a public page's JS override never runs. -->
    <meta property="og:site_name" content="Trafikcloud" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trafikcloud — administratörspanel för körskolor" />
    <meta property="og:description" content="Trafikcloud — administratörspanel för körskolor" />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trafikcloud" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Trafikcloud</title>
    <!-- Inter (body/UI text) + Red Hat Display (headings — Listivo-inspired
         tenant design system, 2026-08-29: see globals.css's font-heading
         token and the .tenant-shell heading rule) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Red+Hat+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
